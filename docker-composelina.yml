version: '3.8'

services:
  # === 0. BASE DE DONNÉES pour Keycloak ===
  mysql-keycloak:
    image: mysql:8.0
    container_name: mysql-keycloak
    environment:
      - MYSQL_ROOT_PASSWORD=root123
      - MYSQL_DATABASE=keycloak
      - MYSQL_USER=keycloak
      - MYSQL_PASSWORD=keycloak123
    volumes:
      - mysql_keycloak_data:/var/lib/mysql
    networks:
      - ensat-network

  # === 1. LDAP - Annuaire des utilisateurs ===
  openldap:
    image: osixia/openldap:latest
    container_name: openldap
    ports:
      - "389:389"      # Port LDAP standard
    environment:
      - LDAP_ORGANISATION=ENSAT
      - LDAP_DOMAIN=ensat.local
      - LDAP_ADMIN_PASSWORD=admin123
    volumes:
      - ./ldap/data:/var/lib/ldap
      - ./ldap/config:/etc/ldap/slapd.d
      - ./ldap/init.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/50-init.ldif
    networks:
      - ensat-network

  # === 2. Interface d'administration LDAP ===
  phpldapadmin:
    image: osixia/phpldapadmin:latest
    container_name: phpldapadmin
    ports:
      - "8082:80"      # Interface web de gestion LDAP
    environment:
      - PHPLDAPADMIN_LDAP_HOSTS=openldap
    networks:
      - ensat-network
    depends_on:
      - openldap

  # === 3. Keycloak - Authentification SSO ===
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    ports:
      - "8080:8080"    # Interface d'administration Keycloak
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin123
      - KC_DB=mysql
      - KC_DB_URL_HOST=mysql-keycloak
      - KC_DB_URL_DATABASE=keycloak
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=keycloak123
      - KC_HTTP_ENABLED=true
    networks:
      - ensat-network
    depends_on:
      - mysql-keycloak
      - openldap

  # === 4. Guacamole - Serveur de connexions à distance ===
  guacd:
    image: guacamole/guacd:latest
    container_name: guacd
    networks:
      - ensat-network

  # === 5. Interface Web Guacamole ===
  guacamole:
    image: guacamole/guacamole:latest
    container_name: guacamole
    ports:
      - "8081:8080"    # Interface web pour accéder aux VMs
    environment:
      - GUACD_HOSTNAME=guacd
      - GUACAMOLE_HOME=/etc/guacamole
    volumes:
      - ./guacamole/guacamole.properties:/etc/guacamole/guacamole.properties
    networks:
      - ensat-network
    depends_on:
      - guacd
      - keycloak

networks:
  ensat-network:
    driver: bridge

volumes:
  mysql_keycloak_data: